// Turns the two doors of the AF Command Post. doors1 is the entrance, doors2 the vault door.
// The axis selections are in the model's memory LOD.
class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	class AF_CommandPost_Skeleton: Default
	{
		skeletonBones[] =
		{
			"doors1", "",
			"doors2", ""
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};
	class AF_CommandPost: Default
	{
		skeletonName = "AF_CommandPost_Skeleton";
		class Animations
		{
			class Doors1
			{
				type = "rotation";
				source = "doors1";
				selection = "doors1";
				axis = "doors1_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = 1.75; // swings into the command room
			};
			class Doors2
			{
				type = "rotation";
				source = "doors2";
				selection = "doors2";
				axis = "doors2_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = -1.9; // swings out into the command room, away from the panic room
			};
		};
	};
};
